<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nadz All APK</title>
    <!-- Import Font Google untuk gaya tebal/brush -->
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        /* Reset & Background */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #030811;
            background-image: 
                radial-gradient(circle at 50% 50%, #0a1a3a 0%, #030811 80%),
                url('data:image/svg+xml;utf8,<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M10 10 L 90 90 M90 10 L 10 90" stroke="%231a3b6e" stroke-width="0.5" opacity="0.1"/></svg>');
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Container Utama */
        .container {
            max-width: 450px;
            width: 100%;
            background: rgba(5, 15, 35, 0.8);
            border: 2px solid #0044cc;
            border-radius: 15px;
            padding: 25px 20px;
            box-shadow: 0 0 25px rgba(0, 102, 255, 0.4), inset 0 0 20px rgba(0, 102, 255, 0.2);
            position: relative;
            backdrop-filter: blur(5px);
        }

        /* Efek Garis Sirkuit (Hiasan) */
        .container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border: 1px solid #00aaff;
            border-radius: 15px;
            z-index: -1;
            opacity: 0.5;
            filter: blur(4px);
        }

        /* Header / Judul */
        .header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .header h1 {
            font-family: 'Permanent Marker', cursive;
            font-size: 2.8rem;
            line-height: 1;
            color: #ffffff;
            text-shadow: 
                3px 3px 0 #0044cc,
                -2px -2px 0 #00aaff,
                0 0 15px #0066ff,
                0 0 30px #0066ff;
            transform: rotate(-3deg);
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .header h1 span {
            display: block;
            font-size: 3.5rem;
            color: #00e5ff;
            text-shadow: 
                2px 2px 0 #002266,
                0 0 20px #00aaff,
                0 0 40px #0066ff;
            transform: rotate(2deg);
            margin-top: -10px;
        }

        /* Garis Bawah */
        .underline {
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #00aaff, #00e5ff, #00aaff, transparent);
            margin: 10px 0 20px 0;
            border-radius: 50%;
            box-shadow: 0 0 10px #00aaff;
        }

        /* Ikon Android */
        .android-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px auto;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%2300e5ff"><path d="M17.6 9.48l1.84-3.18c.16-.3.04-.68-.26-.84-.3-.16-.68-.04-.84.26l-1.86 3.22c-1.44-.66-3.06-1.04-4.78-1.04s-3.34.38-4.78 1.04L5.06 5.72c-.16-.3-.54-.42-.84-.26-.3.16-.42.54-.26.84l1.84 3.18C3.34 10.86 2 13.12 2 15.68h20c0-2.56-1.34-4.82-3.4-6.2zM7 14.5c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm10 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(0 0 10px #00aaff);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px #00aaff); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 20px #00e5ff); }
            100% { transform: scale(1); filter: drop-shadow(0 0 5px #00aaff); }
        }

        /* Daftar Layanan */
        .service-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .service-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 68, 204, 0.2);
            border-left: 4px solid #00e5ff;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 102, 255, 0.1);
        }

        .service-item:hover {
            background: rgba(0, 68, 204, 0.4);
            box-shadow: 0 0 15px rgba(0, 170, 255, 0.5);
            transform: translateX(5px);
        }

        .service-item.selected {
            background: rgba(0, 102, 255, 0.4);
            border-left: 4px solid #ffffff;
            box-shadow: 0 0 20px rgba(0, 170, 255, 0.8);
        }

        .service-info h3 {
            font-family: 'Permanent Marker', cursive;
            font-size: 1.3rem;
            color: #ffffff;
            text-shadow: 1px 1px 0 #0044cc;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .service-info p {
            font-size: 0.9rem;
            color: #a0c4ff;
            font-weight: 700;
        }

        .price {
            font-size: 1.2rem;
            font-weight: 900;
            color: #00e5ff;
            text-shadow: 0 0 10px #00aaff;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid #00aaff;
        }

        /* Tombol Beli */
        .btn-buy {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #0044cc, #00aaff);
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-family: 'Permanent Marker', cursive;
            font-size: 1.5rem;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 170, 255, 0.6);
            transition: all 0.3s ease;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .btn-buy:hover {
            transform: scale(1.02);
            box-shadow: 0 0 35px rgba(0, 229, 255, 0.9);
            background: linear-gradient(135deg, #0055ff, #00e5ff);
        }

        .btn-buy:active {
            transform: scale(0.98);
        }

        .btn-buy::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* Modal Pop-up */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #050f23;
            border: 2px solid #00aaff;
            border-radius: 15px;
            padding: 25px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 30px rgba(0, 170, 255, 0.8);
            position: relative;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-content h2 {
            font-family: 'Permanent Marker', cursive;
            color: #00e5ff;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.8rem;
            text-shadow: 0 0 10px #00aaff;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 700;
            color: #a0c4ff;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 68, 204, 0.2);
            border: 1px solid #0044cc;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #00e5ff;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-cancel {
            background: #1a1a1a;
            color: #888;
            border: 1px solid #333;
        }

        .btn-cancel:hover {
            background: #333;
            color: #fff;
        }

        .btn-submit {
            background: linear-gradient(135deg, #0044cc, #00aaff);
            color: #fff;
            box-shadow: 0 0 15px rgba(0, 170, 255, 0.5);
        }

        .btn-submit:hover {
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.8);
            transform: scale(1.02);
        }

        /* Notifikasi Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, #0044cc, #00aaff);
            color: #fff;
            padding: 15px 25px;
            border-radius: 50px;
            font-weight: 700;
            box-shadow: 0 0 20px rgba(0, 170, 255, 0.8);
            opacity: 0;
            transition: all 0.5s ease;
            z-index: 2000;
            text-align: center;
            max-width: 90%;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>LIST APK NADZ <span>ALL APK</span></h1>
            <div class="underline"></div>
        </div>

        <!-- Ikon Android -->
        <div class="android-icon"></div>

        <!-- Daftar Layanan -->
        <div class="service-list" id="serviceList">
            <div class="service-item" data-id="bug_wa" data-nama="Bug WA" data-harga="1000">
                <div class="service-info">
                    <h3>1. BUG WA</h3>
                    <p>Layanan Bug WhatsApp</p>
                </div>
                <div class="price">1K</div>
            </div>
            <div class="service-item" data-id="cek_waktu" data-nama="Cek Waktu Post" data-harga="500">
                <div class="service-info">
                    <h3>2. CEK WAKTU POST</h3>
                    <p>Layanan Cek Waktu Post</p>
                </div>
                <div class="price">500 Perak</div>
            </div>
        </div>

        <!-- Tombol Beli -->
        <button class="btn-buy" id="btnBeli">BELI SEKARANG</button>
    </div>

    <!-- Modal Formulir -->
    <div class="modal" id="modalForm">
        <div class="modal-content">
            <h2 id="modalTitle">Formulir Pesanan</h2>
            <form id="orderForm">
                <!-- Input tersembunyi untuk menyimpan jenis layanan -->
                <input type="hidden" id="selectedService" value="">
                
                <div class="form-group">
                    <label for="nama">Nama Anda</label>
                    <input type="text" id="nama" placeholder="Masukkan nama Anda" required>
                </div>
                <div class="form-group" id="groupLagu" style="display: none;">
                    <label for="lagu">Judul Lagu</label>
                    <input type="text" id="lagu" placeholder="Masukkan judul lagu">
                </div>
                
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="btnCancel">Batal</button>
                    <button type="submit" class="btn-submit">Kirim & Lanjut</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notifikasi Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // Data Pengguna & Sesi
        let selectedService = null;
        let hasOrderedBugWA = false; // Untuk melacak apakah user sudah pernah daftar Bug WA

        // Elemen DOM
        const serviceItems = document.querySelectorAll('.service-item');
        const btnBeli = document.getElementById('btnBeli');
        const modalForm = document.getElementById('modalForm');
        const modalTitle = document.getElementById('modalTitle');
        const orderForm = document.getElementById('orderForm');
        const selectedServiceInput = document.getElementById('selectedService');
        const groupLagu = document.getElementById('groupLagu');
        const inputLagu = document.getElementById('lagu');
        const inputNama = document.getElementById('nama');
        const btnCancel = document.getElementById('btnCancel');
        const toast = document.getElementById('toast');

        // Fungsi Menampilkan Notifikasi
        function showToast(message, duration = 3000) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        // Fungsi Membuka TikTok
        function openTikTok() {
            window.open('https://www.tiktok.com/@renad9879', '_blank');
        }

        // Event Listener untuk Memilih Layanan
        serviceItems.forEach(item => {
            item.addEventListener('click', () => {
                // Hapus kelas 'selected' dari semua item
                serviceItems.forEach(i => i.classList.remove('selected'));
                // Tambahkan kelas 'selected' ke item yang diklik
                item.classList.add('selected');
                
                // Simpan data layanan yang dipilih
                selectedService = {
                    id: item.dataset.id,
                    nama: item.dataset.nama,
                    harga: item.dataset.harga
                };
            });
        });

        // Event Listener Tombol Beli
        btnBeli.addEventListener('click', () => {
            if (!selectedService) {
                showToast('Silakan pilih layanan terlebih dahulu!');
                return;
            }

            // Atur judul modal
            modalTitle.textContent = `Pesan: ${selectedService.nama}`;
            selectedServiceInput.value = selectedService.id;

            // Logika tampilan form berdasarkan layanan
            if (selectedService.id === 'bug_wa') {
                groupLagu.style.display = 'block';
                inputLagu.setAttribute('required', 'required');
            } else {
                groupLagu.style.display = 'none';
                inputLagu.removeAttribute('required');
                inputLagu.value = ''; // Kosongkan jika tidak diperlukan
            }

            // Tampilkan modal
            modalForm.style.display = 'flex';
        });

        // Event Listener Tombol Batal
        btnCancel.addEventListener('click', () => {
            modalForm.style.display = 'none';
            orderForm.reset();
        });

        // Menutup modal jika klik di luar area modal
        modalForm.addEventListener('click', (e) => {
            if (e.target === modalForm) {
                modalForm.style.display = 'none';
                orderForm.reset();
            }
        });

        // Event Listener Submit Form
        orderForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const nama = inputNama.value.trim();
            const lagu = inputLagu.value.trim();
            const serviceId = selectedServiceInput.value;

            if (!nama) {
                showToast('Nama tidak boleh kosong!');
                return;
            }

            // Logika Proses Pesanan
            if (serviceId === 'bug_wa') {
                if (!lagu) {
                    showToast('Judul lagu tidak boleh kosong!');
                    return;
                }
                
                // Simpan status bahwa user sudah daftar Bug WA
                hasOrderedBugWA = true;
                
                // Tampilkan notifikasi sukses
                showToast(`Pesanan Bug WA berhasil!\nNama: ${nama}\nLagu: ${lagu}\nLanjut ke TikTok...`, 4000);
                
                // Tutup modal setelah jeda
                setTimeout(() => {
                    modalForm.style.display = 'none';
                    orderForm.reset();
                    openTikTok();
                }, 1500);

            } else if (serviceId === 'cek_waktu') {
                // Tampilkan notifikasi sukses
                showToast(`Pesanan Cek Waktu Post berhasil!\nNama: ${nama}\nLanjut ke TikTok...`, 4000);
                
                // Tutup modal dan langsung buka TikTok
                setTimeout(() => {
                    modalForm.style.display = 'none';
                    orderForm.reset();
                    openTikTok();
                }, 1500);
            }
        });

        // Logika Tambahan: Jika user sudah pernah daftar Bug WA, maka tombol beli untuk Cek Waktu Post juga langsung ke TikTok.
        // (Fitur ini diimplementasikan secara implisit: Setiap pembelian akan diarahkan ke TikTok, 
        // tetapi jika user sudah pernah daftar Bug WA, sistem bisa memberikan pesan tambahan jika diinginkan).
        // Untuk saat ini, semua alur pembelian berujung ke TikTok sesuai permintaan.
    </script>
</body>
</html>
